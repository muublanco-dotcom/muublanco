<main>
<div class="page-head">
<p class="eyebrow">06 — Prensa</p>
<h1>Prensa</h1>
<p>Reseñas publicadas sobre el trabajo de Muu Blanco en periódicos y revistas, ordenadas cronológicamente.</p>
</div>

<div class="page-body">
<div id="press">
<p class="muted">Cargando reseñas…</p>
</div>
</div>
</main>

<footer class="site-footer">
<div class="site-footer__inner">
<span><em>Muu Blanco</em></span>
<span>Artista &amp; músico — Caracas / Miami.</span>
</div>
</footer>

<script src="js/main.js"></script>
<script>
(function () {
  const root = document.querySelector("#press");
  if (!root) return;
  const esc = (s) => (s || "").toString().replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const yearKey = (y) => parseInt((y || "").toString().replace(/[^0-9].*$/, ""), 10) || 0;
  const driveThumb = (id, w = 900) => `https://drive.google.com/thumbnail?id=${id}&sz=w${w}`;
  const driveView = (id) => `https://drive.google.com/file/d/${id}/view`;

  fetch("data/prensa.json", { cache: "no-store" })
    .then((r) => r.json())
    .then((entries) => {
      if (!entries || !entries.length) { root.innerHTML = '<p class="muted">Aún no hay reseñas publicadas.</p>'; return; }
      entries.sort((a, b) => yearKey(b.year) - yearKey(a.year));
      root.innerHTML = `<div class="press-list">${entries.map((e) => `
        <article class="press-entry">
          <p class="press-entry__year">${esc(e.year)}</p>
          <div>
            ${e.imageId ? `<a class="press-entry__img" href="${driveView(e.imageId)}" target="_blank" rel="noopener"><img src="${driveThumb(e.imageId)}" alt="${esc(e.outlet)}" loading="lazy" referrerpolicy="no-referrer"></a>` : ""}
            <p class="press-entry__outlet">${esc(e.outlet)}${e.kind ? ` <span class="badge">${esc(e.kind)}</span>` : ""}</p>
            ${e.place ? `<p class="press-entry__place">${esc(e.place)}</p>` : ""}
            ${e.note ? `<p class="press-entry__note">${esc(e.note)}</p>` : ""}
          </div>
        </article>
      `).join("")}</div>`;
    })
    .catch(() => { root.innerHTML = '<p class="muted">No se pudieron cargar las reseñas.</p>'; });
})();
</script>
</body>
</html>
